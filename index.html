<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <meta
      name="description"
      content="交大日本文化研究社內容發布管理後台，用於編輯公告與活動日誌內容，僅供社團幹部使用。"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="交大日本文化研究社" />
    <meta property="og:title" content="JCC CMS 後台" />
    <meta
      property="og:description"
      content="交大日本文化研究社內容管理後台，用於編輯公告與活動日誌內容，僅供社團幹部使用。"
    />
    <meta property="og:image" content="logo.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JCC CMS 後台" />
    <meta
      name="twitter:description"
      content="交大日本文化研究社內容管理後台，用於編輯公告與活動日誌內容，僅供社團幹部使用。"
    />
    <meta name="twitter:image" content="logo.webp" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
          CMS.registerEventListener({
            name: 'preSave',
            handler: ({ entry }) => {
              const currentData = entry.get('data');

              const now = new Date();
              const utc8Time = new Date(now.getTime() + (8 * 60 * 60 * 1000));
              const timestamp = utc8Time.toISOString().replace('Z', '+08:00');

              const newData = currentData.set('publishTimestamp', timestamp);
              return newData;
            },
          });
        </script>
  </body>
</html>
