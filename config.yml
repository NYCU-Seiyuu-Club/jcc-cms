backend:
  name: github
  repo: NYCU-Seiyuu-Club/nycu-jcc-website
  branch: main

media_folder: "public/images/announcements"
public_folder: "/images/announcements"

collections:
  # =========================================
  # 1. 公告 (Announcements)
  # =========================================
  - name: "announcements"
    label: "公告 (Announcements)"
    folder: "src/data/announcements"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - label: "網址路徑 (Slug)"
        name: "slug"
        widget: "string"
        hint: "請輸入英文小寫、數字、橫線或底線，例如: my-first-post"
        pattern: ["^[a-z0-9]+(?:[-_][a-z0-9]+)*$", "Slug 只能使用英文小寫、數字、橫線或底線，且不能連續或放在開頭結尾"]

      - label: "標題 (Title)"
        name: "title"
        widget: "string"

      - label: "發布設定 (Publish Schedule)"
        name: "publishTimestamp"
        widget: "publish-schedule"
        default: ""
        hint: "可選擇立即發布，或使用台北時間排程（須至少提前 10 分鐘）。"

      - label: "活動日期 (Date)"
        name: "date"
        widget: "datetime"
        required: false
        format: "YYYY-MM-DD"
        date_format: "YYYY/MM/DD"
        time_format: false
        hint: "選填；沒有確定活動日期時可留空。"

      - label: "活動時間 (Time)"
        name: "time"
        widget: "string"
        required: false
        hint: "選填；請使用 24 小時制，例如 19:30。只有日期時可留空。"
        pattern: ["^(?:[01]\\d|2[0-3]):[0-5]\\d$", "時間格式請使用 HH:mm，例如 19:30"]

      - label: "分類 (Category)"
        name: "category"
        widget: "select"
        options: ["通知", "社課", "擺攤", "活動", "徵件", "其他"]

      - label: "群組 (Group)"
        name: "group"
        widget: "select"
        options: ["NONE","UTAGE", "POPULAR", "TRADITION", "GEO"]
        required: false

      - label: "封面圖片 (Cover Image)"
        name: "coverImage"
        widget: "image"
        required: false

      - label: "摘要 (Summary)"
        name: "summary"
        widget: "text"
        required: false
        pattern: ["^[\\s\\S]{0,60}$", "摘要請勿超過 60 字"]

      - label: "內文 (Body)"
        name: "body"
        widget: "markdown"

  # =========================================
  # 2. 日誌 (Journals)
  # =========================================
  - name: "journals"
    label: "日誌 (Journals)"
    folder: "src/data/journals"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - label: "網址路徑 (Slug)"
        name: "slug"
        widget: "string"
        hint: "請輸入英文小寫、數字、橫線或底線，例如: my-first-journal"
        pattern: ["^[a-z0-9]+(?:[-_][a-z0-9]+)*$", "Slug 只能使用英文小寫、數字、橫線或底線，且不能連續或放在開頭結尾"]

      - label: "標題 (Title)"
        name: "title"
        widget: "string"

      - label: "作者 (Author)"
        name: "author"
        widget: "string"
        required: false
        hint: "選填；填寫後會顯示在 Journal 卡片與文章頁。"

      - label: "發布設定 (Publish Schedule)"
        name: "publishTimestamp"
        widget: "publish-schedule"
        default: ""
        hint: "可選擇立即發布，或使用台北時間排程（須至少提前 10 分鐘）。"

      - label: "活動日期 (Date)"
        name: "date"
        widget: "datetime"
        required: false
        format: "YYYY-MM-DD"
        date_format: "YYYY/MM/DD"
        time_format: false
        hint: "選填；沒有確定活動日期時可留空。"

      - label: "活動時間 (Time)"
        name: "time"
        widget: "string"
        required: false
        hint: "選填；請使用 24 小時制，例如 19:30。只有日期時可留空。"
        pattern: ["^(?:[01]\\d|2[0-3]):[0-5]\\d$", "時間格式請使用 HH:mm，例如 19:30"]

      - label: "分類 (Category)"
        name: "category"
        widget: "select"
        options: ["社課", "活動", "旅遊", "跑場（Live）", "心得", "交流", "其他"]

      - label: "群組 (Group)"
        name: "group"
        widget: "select"
        options: ["NONE", "UTAGE", "POPULAR", "TRADITION", "GEO"]
        required: false

      - label: "封面圖片 (Cover Image)"
        name: "coverImage"
        widget: "image"
        required: false

      - label: "摘要 (Summary)"
        name: "summary"
        widget: "text"
        required: false
        pattern: ["^[\\s\\S]{0,60}$", "摘要請勿超過 60 字"]

      - label: "內文 (Body)"
        name: "body"
        widget: "markdown"
