backend:
  name: github
  repo: NYCU-Seiyuu-Club/nycu-jcc-website
  branch: main

media_folder: "public/images/announcements"
public_folder: "/images/announcements"

collections:
  # =========================================
  # 1. 公告 (Announcements)
  # =========================================
  - name: "announcements"
    label: "公告 (Announcements)"
    folder: "src/data/announcements"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "網址路徑 (Slug)"
        name: "slug"
        widget: "string"
        hint: "請輸入英文小寫與橫線，例如: my-first-post"

      - label: "標題 (Title)"
        name: "title"
        widget: "string"

      - label: "發布設定 (Publish Schedule)"
        name: "publishTimestamp"
        widget: "publish-schedule"
        default: ""
        hint: "可選擇立即發布，或使用台北時間排程（須至少提前 10 分鐘）。"

      - label: "活動日期 (Date)"
        name: "date"
        widget: "datetime"
        format: "YYYY/MM/DD HH:mm:ss"

      - label: "分類 (Category)"
        name: "category"
        widget: "select"
        options: ["通知", "社課", "擺攤", "活動", "徵件", "其他"]

      - label: "群組 (Group)"
        name: "group"
        widget: "select"
        options: ["NONE","UTAGE", "POPULAR", "TRADITION", "GEO"]
        required: false

      - label: "封面圖片 (Cover Image)"
        name: "coverImage"
        widget: "image"
        required: false

      - label: "摘要 (Summary)"
        name: "summary"
        widget: "text"
        required: false
        pattern: ["^[\\s\\S]{0,40}$", "摘要請勿超過 40 字"]

      - label: "內文 (Body)"
        name: "body"
        widget: "markdown"

  # =========================================
  # 2. 日誌 (Journals)
  # =========================================
  - name: "journals"
    label: "日誌 (Journals)"
    folder: "src/data/journals"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "網址路徑 (Slug)"
        name: "slug"
        widget: "string"
        hint: "請輸入英文小寫與橫線，例如: my-first-journal"

      - label: "標題 (Title)"
        name: "title"
        widget: "string"

      - label: "發布設定 (Publish Schedule)"
        name: "publishTimestamp"
        widget: "publish-schedule"
        default: ""
        hint: "可選擇立即發布，或使用台北時間排程（須至少提前 10 分鐘）。"

      - label: "活動日期 (Date)"
        name: "date"
        widget: "datetime"
        format: "YYYY/MM/DD HH:mm:ss"

      - label: "分類 (Category)"
        name: "category"
        widget: "select"
        options: ["社課", "活動", "旅遊", "跑場（Live）", "心得", "交流", "其他"]

      - label: "群組 (Group)"
        name: "group"
        widget: "select"
        options: ["NONE", "UTAGE", "POPULAR", "TRADITION", "GEO"]
        required: false

      - label: "封面圖片 (Cover Image)"
        name: "coverImage"
        widget: "image"
        required: false

      - label: "摘要 (Summary)"
        name: "summary"
        widget: "text"
        required: false
        pattern: ["^[\\s\\S]{0,40}$", "摘要請勿超過 40 字"]

      - label: "內文 (Body)"
        name: "body"
        widget: "markdown"
